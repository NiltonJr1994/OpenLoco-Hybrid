name: Hybrid v0.3 Windows test build

on:
  push:
    branches:
      - hybrid/v0.3-map-integration
  workflow_dispatch:

jobs:
  windows-x64:
    name: Hybrid Windows x64
    runs-on: windows-2022
    env:
      CONFIGURATION: Release
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup cache env vars
        shell: pwsh
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force "${{ github.workspace }}/vcpkg-cache" | Out-Null

      - name: Get vcpkg baseline
        id: vcpkg_baseline
        shell: bash
        run: |
          sha=$(sed -n 's/^set(VCPKG_GIT_TAG[[:space:]]*\([0-9a-f]*\)).*/\1/p' CMakeLists.txt)
          test -n "$sha" || { echo "VCPKG_GIT_TAG not found in CMakeLists.txt" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: windows-2022-64-vcpkg-${{ steps.vcpkg_baseline.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            windows-2022-64-vcpkg-${{ steps.vcpkg_baseline.outputs.sha }}-

      - name: Apply Hybrid map integration
        shell: pwsh
        run: python tools/hybrid/apply_v03.py

      - name: Apply Hybrid v0.3.2 footprint integration
        shell: pwsh
        run: python tools/hybrid/apply_v032.py

      - name: Configure
        shell: cmd
        run: cmake --preset windows

      - name: Build
        shell: cmd
        run: cmake --build --preset windows-release

      - name: Verify Hybrid binary markers
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          exe = Path(r"build/windows/Release/OpenLoco.exe")
          if not exe.exists():
              raise SystemExit("OpenLoco.exe was not produced")
          data = exe.read_bytes()
          for marker in [b"Parks (Hybrid)", b"v0.3.2-alpha", b"7x7 tiles", b"RCT2 assets", b"BUILD PARK", b"Park Interior"]:
              if marker not in data:
                  raise SystemExit(f"Missing Hybrid marker: {marker!r}")
          print(f"Verified Hybrid executable: {exe.stat().st_size} bytes")
          '@ | python -

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: windows-2022-64-vcpkg-${{ steps.vcpkg_baseline.outputs.sha }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-cache/**') }}

      - name: Package test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force hybrid-artifact | Out-Null
          New-Item -ItemType Directory -Force hybrid-artifact\RCT2 | Out-Null
          Copy-Item CHANGELOG.md,CONTRIBUTORS.md,LICENSE hybrid-artifact
          Copy-Item build\windows\Release\* hybrid-artifact -Recurse
          @"
          OpenLoco Hybrid v0.3.2-alpha - RCT2 Assets + Regional Park Footprint Test

          IMPORTANT: extract the full ZIP to a new folder. Do not replace your normal OpenLoco installation.

          RCT2 ASSETS ARE REQUIRED FOR PARKS TO APPEAR IN THE MENU.
          Copy from your legitimate RollerCoaster Tycoon 2 installation into the RCT2 folder beside OpenLoco.exe:
              RCT2\Data\g1.dat
              RCT2\ObjData\*.DAT

          You may copy the complete Data and ObjData folders. Do not mix RCT2 ObjData directly into Locomotion ObjData.

          Test flow:
          1. Before copying RCT2 assets, start the game and confirm Parks (Hybrid) does NOT appear in the Towns/Industries menu.
          2. Close the game, copy RCT2 Data and ObjData into the included RCT2 folder, then start again.
          3. Parks (Hybrid) must now appear.
          4. Open Parks (Hybrid). Text and button labels must be visible.
          5. Click BUILD PARK and move the mouse over the map. The placement preview must highlight a 7x7 tile square, not one tile.
          6. Try far from a town: construction must be rejected beyond 48 tiles from the nearest town centre.
          7. Try a site touching water/map edge: construction must be rejected if the whole 7x7 footprint cannot fit on land.
          8. Build near a town on land. The company pays 75,000 and the selected park keeps the full 7x7 footprint highlighted.
          9. ENTER PARK remains the management prototype for the next RCT2-object renderer stage.

          Architecture decision in this build:
          - the regional park site is fixed at 7x7 tiles (49 tiles) for predictable identification and placement;
          - the clicked tile is the centre of the site;
          - future regional entrance/rides/parking visuals may vary inside that 7x7 envelope, similar to an industry complex, without moving the reserved site;
          - RCT2 assets remain isolated under RCT2\ and are never copied into Locomotion ObjData, protecting vehicle/cargo/industry mods;
          - no copyrighted RCT2 assets are included in this ZIP; the build only uses the files already owned by the tester;
          - this alpha validates asset detection, UI, terrain footprint and park siting. Actual RCT2 sprite rendering is the next bridge layer.
          "@ | Set-Content -Encoding UTF8 hybrid-artifact\HYBRID-TEST.txt

          @"
          REQUIRED RCT2 FILES

          Place your original RCT2 files here without merging them with Locomotion:

              RCT2\Data\g1.dat
              RCT2\ObjData\*.DAT

          Recommended: copy the entire Data and ObjData folders from the RCT2 installation.
          Parks (Hybrid) stays hidden until both g1.dat and at least one ObjData .DAT are detected.
          "@ | Set-Content -Encoding UTF8 hybrid-artifact\RCT2\PUT-RCT2-ASSETS-HERE.txt

      - name: Upload Hybrid test build
        uses: actions/upload-artifact@v7
        with:
          name: OpenLoco-Hybrid-v0.3.2-alpha-Windows-x64
          path: hybrid-artifact/
          if-no-files-found: error
