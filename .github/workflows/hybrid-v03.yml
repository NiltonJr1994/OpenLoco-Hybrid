name: Hybrid v0.3 Windows test build

on:
  push:
    branches:
      - hybrid/v0.3-map-integration
  workflow_dispatch:

jobs:
  windows-x64:
    name: Hybrid Windows x64
    runs-on: windows-2022
    env:
      CONFIGURATION: Release
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup cache env vars
        shell: pwsh
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force "${{ github.workspace }}/vcpkg-cache" | Out-Null

      - name: Get vcpkg baseline
        id: vcpkg_baseline
        shell: bash
        run: |
          sha=$(sed -n 's/^set(VCPKG_GIT_TAG[[:space:]]*\([0-9a-f]*\)).*/\1/p' CMakeLists.txt)
          test -n "$sha" || { echo "VCPKG_GIT_TAG not found in CMakeLists.txt" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: windows-2022-64-vcpkg-${{ steps.vcpkg_baseline.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            windows-2022-64-vcpkg-${{ steps.vcpkg_baseline.outputs.sha }}-

      - name: Apply Hybrid map integration
        shell: pwsh
        run: python tools/hybrid/apply_v03.py

      - name: Configure
        shell: cmd
        run: cmake --preset windows

      - name: Build
        shell: cmd
        run: cmake --build --preset windows-release

      - name: Verify Hybrid binary markers
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          exe = Path(r"build/windows/Release/OpenLoco.exe")
          if not exe.exists():
              raise SystemExit("OpenLoco.exe was not produced")
          data = exe.read_bytes()
          for marker in [b"Parks (Hybrid)", b"v0.3.1-alpha", b"BUILD PARK", b"Park Interior", b"BUILD COASTER"]:
              if marker not in data:
                  raise SystemExit(f"Missing Hybrid marker: {marker!r}")
          print(f"Verified Hybrid executable: {exe.stat().st_size} bytes")
          '@ | python -

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: windows-2022-64-vcpkg-${{ steps.vcpkg_baseline.outputs.sha }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-cache/**') }}

      - name: Package test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force hybrid-artifact | Out-Null
          Copy-Item CHANGELOG.md,CONTRIBUTORS.md,LICENSE hybrid-artifact
          Copy-Item build\windows\Release\* hybrid-artifact -Recurse
          @"
          OpenLoco Hybrid v0.3.1-alpha - Functional Park Test

          IMPORTANT: extract the full ZIP to a new folder. Do not replace your normal OpenLoco installation.

          Test flow:
          1. Start OpenLoco.exe and load/start a normal scenario.
          2. Open the Towns/Industries toolbar menu and select "Parks (Hybrid)".
          3. The Regional Management window must contain visible text and buttons.
          4. Click BUILD PARK, then click a land tile. A 75,000 construction payment is booked to Construction.
          5. Select ENTER PARK.
          6. In RIDES / SHOPS build Carousel, Ferris Wheel, Compact Coaster and/or Food Stall. Purchases are charged to Construction.
          7. In FINANCE change the admission price with TICKET -5 / +5.
          8. Let the in-game month change (fast-forward is fine). Visitors/revenue/tax/maintenance are calculated from the nearest real town and the net result is posted to company Miscellaneous.
          9. Reopen the park screens and verify the previous-month figures changed.

          Expected alpha behaviour:
          - the regional window and park interior are native OpenLoco windows;
          - parks are session-only in v0.3.1 (SV5 persistence comes later);
          - the regional park is represented by a highlighted map anchor, not a park sprite yet;
          - attraction buttons are management prototypes, not RCT2 track placement yet;
          - no ObjData vehicle/cargo/industry file is changed;
          - multiplayer park finance is intentionally disabled until commands are network-safe.
          "@ | Set-Content -Encoding UTF8 hybrid-artifact\HYBRID-TEST.txt

      - name: Upload Hybrid test build
        uses: actions/upload-artifact@v7
        with:
          name: OpenLoco-Hybrid-v0.3.1-alpha-Windows-x64
          path: hybrid-artifact/
          if-no-files-found: error
